<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Talento Ejecutivo</title>
    <meta name="description" content="Busca y encuentra a los mejores perfiles ejecutivos y técnicos.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/themes/default.css">
    <link rel="stylesheet" href="/css/core.css">
    <link rel="stylesheet" href="/css/portal.css">
</head>
<body>
    <div class="app-wrapper portal-wrapper">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        
        <main class="portal-container">
            <header class="portal-header fade-up">
                <h1 class="gradient-text">Directorio de Talento</h1>
                <p>Encuentra perfiles ejecutivos, ingenieros y especialistas por palabra clave, tecnología o rol.</p>
                
                <div class="search-box glass-panel">
                    <input type="text" id="searchInput" placeholder="Ej. Informática, Diseño, AWS, Gerente..." autocomplete="off">
                </div>
                <div class="search-stats" id="searchStats">Cargando base de datos...</div>
            </header>

            <section class="results-grid" id="resultsGrid">
                <!-- Resultados renderizados por JS -->
            </section>
        </main>
    </div>

    <script src="/js/search.js"></script>
</body>
</html>
