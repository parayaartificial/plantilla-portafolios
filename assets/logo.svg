<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lightning bolt icon -->
  <g transform="translate(10, 15)">
    <!-- Main bolt -->
    <polygon points="25,0 10,42 22,42 15,65 45,22 30,22 38,0" fill="url(#grad)" />
    <!-- Glow effect -->
    <polygon points="25,0 10,42 22,42 15,65 45,22 30,22 38,0" fill="url(#grad)" opacity="0.3" filter="blur(3px)" />
  </g>
  
  <!-- STRIKING text -->
  <text x="70" y="45" font-family="'Outfit', sans-serif" font-weight="800" font-size="36" fill="url(#grad)" letter-spacing="3">STRIKING</text>
  
  <!-- Tagline -->
  <text x="70" y="70" font-family="'Inter', sans-serif" font-weight="300" font-size="11" fill="#94A3B8" letter-spacing="4">SOLUCIONES INFORMÁTICAS</text>
</svg>
